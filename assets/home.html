<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khromium</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#000;font-family:"DejaVu Sans",sans-serif}main{min-height:86vh;display:flex;align-items:center;justify-content:center;padding:24px 20px 12vh}.home{width:min(80vw,720px);text-align:center}h1{font-weight:400;font-size:58px;margin:0 0 24px;letter-spacing:-2px}form{margin:0}.search{display:flex;border:2px solid #111;border-radius:50px;overflow:hidden;min-height:76px}input[type=search]{font:30px "DejaVu Sans",sans-serif;border:0;background:white;color:black;padding:15px 22px;width:100%;min-width:0;outline:none}button{background:white;border:0;min-width:76px;cursor:pointer;color:black}svg{width:30px;height:30px}p{font-size:24px;margin:15px 0 8px}.engines{display:flex;justify-content:center;gap:24px;align-items:center}label{font-size:27px;cursor:pointer;padding:10px 0;border-bottom:2px solid transparent}label:has(input:checked){border-color:#000;font-weight:700}input[type=radio]{position:absolute;opacity:0;pointer-events:none}#error{min-height:28px;font-size:20px;margin-top:18px}footer{font-size:18px;position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#555}</style>
<main><section class="home"><h1>Khromium</h1><form id="search-form"><div class="search"><input id="search" type="search" aria-label="Search or enter address" placeholder="Search" autocomplete="off"><button aria-label="Search" type="submit"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="m20 20 9 9" stroke="currentColor" stroke-width="2.5"/></svg></button></div><p>Search with</p><div class="engines"><label><input type="radio" name="engine" value="google">Google</label><label><input type="radio" name="engine" value="duckduckgo">DuckDuckGo</label><label><input type="radio" name="engine" value="www" checked>WWW</label></div><div id="error" role="status"></div></form></section></main><footer>156.0 HF</footer>
<script>
'use strict';
const preferred=new URLSearchParams(location.search).get('engine');
const selected=document.querySelector(`input[name=engine][value="${['google','duckduckgo','www'].includes(preferred)?preferred:'www'}"]`);selected.checked=true;
document.querySelector('#search-form').onsubmit=e=>{e.preventDefault();const value=document.querySelector('#search').value.trim();const engine=document.querySelector('input[name=engine]:checked').value;const error=document.querySelector('#error');error.textContent='';if(!value)return;let url;
 if(engine==='google')url='https://www.google.com/search?q='+encodeURIComponent(value);
 else if(engine==='duckduckgo')url='https://duckduckgo.com/?q='+encodeURIComponent(value);
 else{if(/\s/.test(value)){error.textContent='WWW opens an address directly. Enter a URL, or choose Google or DuckDuckGo.';return;}url=/^[a-z][a-z0-9+.-]*:\/\//i.test(value)?value:'https://'+value;}
 if(typeof window.khromiumNavigate==='function')window.khromiumNavigate(url);else location.href=url;
};
</script></html>
